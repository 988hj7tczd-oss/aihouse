name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: pip install -e .
      
      - name: Test imports
        run: |
          python -c "from aihouse.core.models import AgentTask, TaskStatus; print('OK')"
          python -c "from aihouse.core.storage import Storage; print('OK')"
          python -c "from aihouse.core.scheduler import Scheduler; print('OK')"
          python -c "from aihouse.adapters.generic import GenericAdapter; print('OK')"
      
      - name: Test storage
        run: python -c "from aihouse.core.storage import Storage; from aihouse.core.models import AgentTask; s=Storage('/tmp/ci_test.db'); s.save_task(AgentTask(agent_name='CI',agent_type='test',task_id='ci1',description='CI测试')); assert s.get_task('ci1') is not None; print('OK')"
      
      - name: Test CLI
        run: aihouse --version
