[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aihouse"
version = "0.1.1"
description = "AIHouse - AI Agent 统一监控与管理平台"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "flask>=3.0",
    "flask-cors>=4.0",
    "apscheduler>=3.10",
    "requests>=2.31",
    "psutil>=5.9",
    "watchdog>=4.0",
    "plyer>=2.0",
]

[project.scripts]
aihouse = "aihouse.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
